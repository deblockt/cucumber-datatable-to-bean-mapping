plugins {
    id 'java'
}

dependencies {
    testImplementation project(':lib')

    // Old Cucumber version on purpose, to check compatibility with older Cucumber releases
    testImplementation 'io.cucumber:cucumber-java8:7.10.0'
}

configurations {
    cucumberRuntime {
        extendsFrom testImplementation
    }
}

// No JUnit runner here, the scenarios run with cucumberCli
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.register('cucumberCli', JavaExec) {
    dependsOn assemble, testClasses
    mainClass = 'io.cucumber.core.cli.Main'
    classpath = configurations.cucumberRuntime + sourceSets.main.output + sourceSets.test.output
    args = [
            '--plugin', 'pretty',
            '--plugin', 'html:target/cucumber-report.html',
            '--glue', 'com.deblock.cucumber',
            'src/test/resources'
    ]
}
